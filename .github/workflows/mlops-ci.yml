name: MLOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Data Generation & Export
      run: |
        echo "Running data export script..."
        python src/export_data.py
        
    - name: Test Model Training & MLflow Logging
      run: |
        echo "Running model training script..."
        python src/train.py

    - name: Verify Backend API Startup (Dry Run)
      run: |
        echo "Checking if FastAPI can initialize successfully..."
        # We start it in the background and immediately kill it to ensure no syntax/import errors
        uvicorn app.main:app &
        sleep 3
        kill $!
